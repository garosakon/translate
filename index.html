<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨身口語即時翻譯機</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* 麥克風波紋動畫 */
        .pulse-ring {
            content: '';
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulsate 2s infinite;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            background: rgba(59, 130, 246, 0.5);
            opacity: 0;
        }

        .listening .pulse-ring {
            opacity: 1;
        }

        @keyframes pulsate {
            0% { transform: scale(1, 1); opacity: 0.8; }
            100% { transform: scale(1.5, 1.5); opacity: 0; }
        }

        /* 自定義捲軸 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #9ca3af; 
        }

        .gradient-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-gray-800">

    <!-- Header -->
    <header class="gradient-bg text-white p-4 shadow-lg flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-language text-2xl"></i>
            <h1 class="text-lg font-bold tracking-wide">隨身口語翻譯</h1>
        </div>
        <button onclick="showInfo()" class="text-white hover:text-blue-200 transition">
            <i class="fa-solid fa-circle-info text-xl"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col p-4 gap-4 max-w-2xl mx-auto w-full overflow-y-auto">
        
        <!-- Language Selectors -->
        <div class="bg-white p-3 rounded-2xl shadow-sm flex items-center justify-between gap-2 shrink-0">
            <select id="sourceLang" class="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="zh-TW" selected>繁體中文</option>
                <option value="en-GB">English</option>
                <option value="ja-JP">日本語</option>
                <option value="ko-KR">한국어</option>
            </select>
            
            <button id="swapLangBtn" class="p-2 text-blue-500 hover:bg-blue-50 rounded-full transition">
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>

            <select id="targetLang" class="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="en-GB" selected>English</option>
                <option value="zh-TW">繁體中文</option>
                <option value="ja-JP">日本語</option>
                <option value="ko-KR">한국어</option>
            </select>
        </div>

        <!-- Input Section (Source) -->
        <div class="bg-white rounded-2xl shadow-sm flex flex-col flex-1 min-h-[160px] relative transition-all duration-300 border border-transparent focus-within:border-blue-400">
            <div class="flex justify-between items-center p-3 border-b border-gray-100">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">輸入 / 語音</span>
                <button onclick="copyText('inputText')" class="text-gray-400 hover:text-blue-500 transition text-sm">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
            <textarea id="inputText" class="flex-1 w-full p-4 resize-none focus:outline-none text-lg bg-transparent" placeholder="請點擊麥克風說話，或是輸入文字..."></textarea>
            
            <!-- Clear Button -->
            <button id="clearBtn" class="absolute bottom-3 right-3 text-gray-300 hover:text-red-400 hidden">
                <i class="fa-solid fa-circle-xmark text-xl"></i>
            </button>
        </div>

        <!-- Mic Button Area -->
        <div class="flex justify-center items-center py-2 shrink-0 relative">
            <div id="micRing" class="pulse-ring"></div>
            <button id="micBtn" class="w-16 h-16 rounded-full gradient-bg text-white shadow-lg flex items-center justify-center text-2xl transition-transform active:scale-95 z-10 hover:shadow-xl hover:bg-blue-700">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <!-- Output Section (Target) -->
        <div class="bg-blue-50 rounded-2xl shadow-sm flex flex-col flex-1 min-h-[160px] border border-blue-100 relative">
            <div class="flex justify-between items-center p-3 border-b border-blue-100/50">
                <span class="text-xs font-bold text-blue-400 uppercase tracking-wider">翻譯結果</span>
                <div class="flex gap-3">
                    <button onclick="speakText()" class="text-blue-400 hover:text-blue-600 transition text-sm" title="朗讀">
                        <i class="fa-solid fa-volume-high text-lg"></i>
                    </button>
                    <button onclick="copyText('outputText')" class="text-blue-400 hover:text-blue-600 transition text-sm" title="複製">
                        <i class="fa-regular fa-copy text-lg"></i>
                    </button>
                </div>
            </div>
            <div id="outputText" class="flex-1 w-full p-4 text-lg text-gray-800 overflow-y-auto whitespace-pre-wrap font-medium"></div>
            
            <div id="loadingIndicator" class="absolute inset-0 bg-white/80 rounded-2xl flex items-center justify-center hidden backdrop-blur-sm">
                <div class="flex flex-col items-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-2"></i>
                    <span class="text-xs text-blue-500 font-medium">翻譯中...</span>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Disclaimer -->
    <footer class="p-3 text-center text-xs text-gray-400 shrink-0">
        支援語音辨識之瀏覽器 (Chrome/Safari/Edge)
    </footer>

    <!-- Info Modal -->
    <div id="infoModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-all">
            <h3 class="text-xl font-bold mb-4 text-gray-800">關於應用程式</h3>
            <p class="text-gray-600 mb-4 text-sm leading-relaxed">
                這是一個基於 Web 技術的即時口語翻譯機。<br><br>
                1. <b>語音辨識：</b> 使用瀏覽器內建 Web Speech API。<br>
                2. <b>翻譯來源：</b> 使用 MyMemory Free Translation API (請勿輸入機密資訊)。<br>
                3. <b>操作：</b> 按下中間麥克風即可開始說話，停止說話後會自動翻譯。
            </p>
            <button onclick="closeInfo()" class="w-full py-2 gradient-bg text-white rounded-lg hover:opacity-90 transition">了解</button>
        </div>
    </div>

    <script>
        // --- 變數宣告 ---
        const micBtn = document.getElementById('micBtn');
        const micIcon = micBtn.querySelector('i');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        const swapLangBtn = document.getElementById('swapLangBtn');
        const micRing = document.getElementById('micRing');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const clearBtn = document.getElementById('clearBtn');
        
        let isListening = false;
        let recognition = null;
        let typingTimer; // 用於手動輸入時的延遲翻譯

        // --- 初始化語音識別 ---
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false; // 講完一句自動停止
                recognition.interimResults = true; // 顯示中間結果

                recognition.onstart = () => {
                    isListening = true;
                    micBtn.classList.add('bg-red-500', 'hover:bg-red-600');
                    micBtn.classList.remove('gradient-bg');
                    micIcon.className = 'fa-solid fa-stop';
                    document.body.classList.add('listening');
                    inputText.placeholder = "正在聆聽...";
                };

                recognition.onend = () => {
                    isListening = false;
                    micBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
                    micBtn.classList.add('gradient-bg');
                    micIcon.className = 'fa-solid fa-microphone';
                    document.body.classList.remove('listening');
                    inputText.placeholder = "請點擊麥克風說話，或是輸入文字...";
                    
                    // 如果有內容，觸發翻譯
                    if (inputText.value.trim().length > 0) {
                        performTranslation(inputText.value);
                    }
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    inputText.value = transcript;
                    updateClearBtn();
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error', event.error);
                    isListening = false;
                    micBtn.classList.remove('bg-red-500');
                    micBtn.classList.add('gradient-bg');
                    micIcon.className = 'fa-solid fa-microphone';
                    document.body.classList.remove('listening');
                    inputText.placeholder = "無法存取麥克風或發生錯誤";
                };

            } else {
                micBtn.disabled = true;
                micBtn.classList.add('bg-gray-400');
                alert("您的瀏覽器不支援語音識別功能，請使用 Chrome 或 Safari。");
            }
        }

        // --- 翻譯功能 (使用 MyMemory API) ---
        async function performTranslation(text) {
            if (!text.trim()) return;

            const sl = sourceLang.value.split('-')[0]; // 取前兩碼，例如 zh, en
            const tl = targetLang.value.split('-')[0];
            
            // 介面狀態更新
            loadingIndicator.classList.remove('hidden');
            outputText.innerText = '';

            try {
                // 使用 MyMemory API (免費版有限制，適合 Demo)
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.responseStatus === 200) {
                    outputText.innerText = data.responseData.translatedText;
                } else {
                    outputText.innerText = "翻譯服務忙碌中，請稍後再試。";
                    console.error("Translation Error:", data);
                }
            } catch (error) {
                outputText.innerText = "網路連線錯誤，無法翻譯。";
                console.error("Network Error:", error);
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        // --- 語音合成 (TTS) ---
        function speakText() {
            const text = outputText.innerText;
            if (!text) return;

            // 停止當前語音
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang.value; // 使用完整的語系代碼 (例如 zh-TW)
            
            // 嘗試調整語速和音調讓聲音自然一點
            utterance.rate = 0.9; 
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        // --- 事件監聽與輔助功能 ---
        
        // 1. 麥克風按鈕點擊
        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            
            if (isListening) {
                recognition.stop();
            } else {
                // 設定語言
                recognition.lang = sourceLang.value;
                recognition.start();
            }
        });

        // 2. 文字框手動輸入監聽 (防抖動)
        inputText.addEventListener('input', () => {
            updateClearBtn();
            clearTimeout(typingTimer);
            if (inputText.value.trim()) {
                typingTimer = setTimeout(() => {
                    performTranslation(inputText.value);
                }, 1000); // 停止輸入 1 秒後自動翻譯
            }
        });

        // 3. 切換語言
        swapLangBtn.addEventListener('click', () => {
            const temp = sourceLang.value;
            sourceLang.value = targetLang.value;
            targetLang.value = temp;

            // 如果有文字，也交換並重新翻譯
            if (inputText.value && outputText.innerText) {
                inputText.value = outputText.innerText;
                outputText.innerText = '';
                performTranslation(inputText.value);
            }
            
            // 動畫效果
            swapLangBtn.querySelector('i').classList.add('fa-spin');
            setTimeout(() => swapLangBtn.querySelector('i').classList.remove('fa-spin'), 500);
        });

        // 4. 清除按鈕
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.innerText = '';
            updateClearBtn();
            inputText.focus();
        });

        function updateClearBtn() {
            if (inputText.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        // 5. 複製功能
        function copyText(elementId) {
            const el = document.getElementById(elementId);
            let text = "";
            if (el.tagName === 'TEXTAREA') {
                text = el.value;
            } else {
                text = el.innerText;
            }

            if (!text) return;

            // 使用 Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("已複製到剪貼簿");
                });
            } else {
                // Fallback
                const textarea = document.createElement("textarea");
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
                showToast("已複製到剪貼簿");
            }
        }

        // 簡單的 Toast 提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm shadow-lg transition-opacity duration-300 z-50';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Modal 控制
        function showInfo() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfo() { document.getElementById('infoModal').classList.add('hidden'); }
        document.getElementById('infoModal').addEventListener('click', (e) => {
            if(e.target === document.getElementById('infoModal')) closeInfo();
        });

        // 初始化
        initSpeechRecognition();

    </script>
</body>
</html>
